services:
  mysql:
    image: mysql:8.0
    container_name: dockertask-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dockertask_db
      MYSQL_USER: dockertask_user
      MYSQL_PASSWORD: dockertask_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dockertask_user", "-pdockertask_pass"]
      timeout: 20s
      retries: 15
      interval: 10s
      start_period: 40s

  app:
    build: .
    container_name: dockertask-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dockertask_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000
      SPRING_DATASOURCE_USERNAME: dockertask_user
      SPRING_DATASOURCE_PASSWORD: dockertask_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_CONTINUE_ON_ERROR: false



networks:
  dockertask-network:
    driver: bridge

volumes:
  mysql_data:
