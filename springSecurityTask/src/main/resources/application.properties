spring.application.name=springSecurityTask

# Security Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.example.springSecurityTask=DEBUG
# H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (handy at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Let Spring Boot run schema.sql and data.sql automatically
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.open-in-view=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


